<!doctype html>
<html lang="en">
<head>
<script>window.PORTAL_TARGET='site'</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b2a6b">
<title>Liars Lane</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;min-height:100%}
body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 12px 96px;
  font:800 16px "Fredoka","Baloo 2",ui-rounded,"Segoe UI Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;color:#fff;touch-action:manipulation;
  background:radial-gradient(circle at 80% 6%,#ffd27a55,transparent 32%),linear-gradient(180deg,#3b2a6b 0%,#a0456f 55%,#e98a5b 100%);background-attachment:fixed}
main{width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px}
.hud{display:flex;align-items:center;gap:8px}
.pill{background:#0003;border-radius:999px;padding:7px 14px;box-shadow:inset 0 -3px 0 #0002;white-space:nowrap}
.pill b{margin-left:5px;font-size:18px}
.gap{flex:1}
.btn{font:inherit;color:#4a2f00;background:linear-gradient(#ffe066,#ffb300);border:0;border-bottom:5px solid #c78500;border-radius:14px;padding:10px 14px;cursor:pointer;position:relative;
  box-shadow:0 6px 12px #0003;transition:transform .08s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.btn:focus-visible,.res:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn:disabled{filter:grayscale(.8);opacity:.45;cursor:default}
.btn.blue{color:#fff;background:linear-gradient(#5ec2ff,#2a7de1);border-bottom-color:#1a55a0}
.btn.green{color:#fff;background:linear-gradient(#6be585,#1fa94b);border-bottom-color:#127a32}
.btn.icon{width:42px;height:42px;padding:0;font-size:18px}
.btn.big{font-size:21px;padding:13px 24px}
.btn i{position:absolute;top:-8px;right:-6px;font-style:normal;font-size:11px;color:#fff;background:#e0364e;border-radius:99px;padding:2px 7px}
.sub{text-align:center;font-size:15px;opacity:.9;margin:0}

.res{display:flex;gap:10px;align-items:center;background:#ffffff1f;border:0;border-radius:20px;padding:10px;color:#fff;font:inherit;cursor:pointer;text-align:left;width:100%;box-shadow:0 4px 0 #0003;transition:transform .08s}
.res:active{transform:translateY(2px)}
.face{flex:0 0 auto;width:68px;text-align:center}
.av{display:grid;place-items:center;width:58px;height:58px;margin:0 auto;border-radius:50%;background:#fff;font-size:32px;border:4px solid #ffffff88;box-shadow:0 3px 0 #0003;position:relative}
.res[data-s="1"] .av{border-color:#2fd36b;background:#e6ffee}.res[data-s="2"] .av{border-color:#ff4d5e;background:#ffe6ea}
.badge{position:absolute;right:-8px;bottom:-6px;font-size:20px}
.nm{font-size:13px;margin-top:3px}
.tag{display:inline-block;font-size:11px;border-radius:99px;padding:1px 8px;margin-top:2px;background:#0004}
.res[data-s="1"] .tag{background:#1fa94b}.res[data-s="2"] .tag{background:#e0364e}
.bubble{position:relative;flex:1;background:#fff;color:#2b2350;border-radius:16px;padding:10px 12px;font-size:17px;line-height:1.25;font-weight:800}
.bubble::before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-left:0;border-right-color:#fff}
.bubble b{color:#5b3fd0}
.res.bad .bubble{background:#ffd9de;animation:shake .45s}
.res.lock .av::after{content:"🔒";position:absolute;left:-8px;top:-8px;font-size:16px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;background:linear-gradient(transparent,#2a1747d9 40%)}
.bar .btn{flex:0 1 auto}
.hearts{letter-spacing:2px}

#overlay{position:fixed;inset:0;background:#160c33c4;display:grid;place-items:center;padding:12px;z-index:60;backdrop-filter:blur(3px);overflow:auto}
#overlay[hidden]{display:none}
#card{background:#fff;color:#2b2350;border-radius:26px;padding:22px 22px 24px;text-align:center;width:min(100%,380px);box-shadow:0 20px 50px #0006;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
#card h1{font-size:46px;line-height:.95;margin:0 0 8px;color:#d6336c}
#card h2{margin:4px 0 8px;font-size:26px}
#card p{margin:6px 0;font-size:16px;opacity:.82;font-weight:700}
#card .big-emoji{font-size:50px}
#card .btn.wide{display:block;width:100%;margin-top:10px}
.stars{font-size:42px;letter-spacing:4px;color:#ffb300}
.sol{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.sol span{background:#f3efff;border-radius:99px;padding:4px 10px;font-size:14px}
.adbar{height:10px;border-radius:9px;background:#0001;overflow:hidden;margin-top:14px}
.adbar i{display:block;height:100%;background:#2a7de1;animation:fill 1.5s linear forwards}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;color:#fff;border-radius:99px;padding:10px 18px;z-index:70;font-size:15px;animation:pop .25s;white-space:nowrap}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<main>
  <header class="hud">
    <div class="pill" id="lvpill">Level<b id="lv">1</b></div>
    <div class="pill">Strikes<b class="hearts" id="hearts"></b></div>
    <div class="gap"></div>
    <button class="btn blue icon" id="help" aria-label="How to play">?</button>
    <button class="btn blue icon" id="snd" aria-label="Toggle sound">🔊</button>
  </header>
  <p class="sub">Honest folk always tell the truth. Liars always lie. Tap a resident to mark them.</p>
  <section id="street" aria-label="Residents of Liars Lane"></section>
</main>
<div class="bar">
  <button class="btn blue" id="clear">Clear</button>
  <button class="btn blue" id="hint">💡 Hint <i>AD</i></button>
  <button class="btn green big" id="accuse">Accuse!</button>
</div>
<div id="overlay" hidden><div id="card" role="dialog" aria-live="polite"></div></div>

<script>
const $ = id => document.getElementById(id);

// ---- Overlay + Ads: replace the two Ads bodies with the portal SDK (e.g. Poki commercialBreak / rewardedBreak) ----
function overlay(html){ $('card').innerHTML = html; $('overlay').hidden = false; }
const hide = () => { $('overlay').hidden = true; };
function adBreak(title, done){
  overlay(`<p>${title}</p><h2>Placeholder ad</h2><div class="adbar"><i></i></div>`);
  setTimeout(() => { hide(); done(); }, 1500);
}
let adCalls = 0;   // placeholder ads: show one break in three
const Ads = { interstitial: done => ++adCalls % 3 ? done() : adBreak('Advertisement', done), rewarded: done => adBreak('Watch to claim your reward', done) };
function toast(text){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = text; document.body.append(t); setTimeout(() => t.remove(), 1900); }

// ---- Sound ----
let ac, muted = false;
try { muted = localStorage.getItem('ll-mute') === '1'; } catch {}
function tone(f, t = 0, d = .12, type = 'sine', v = .08){
  if (muted) return;
  try {
    ac ??= new AudioContext();
    const o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + t;
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(.001, s + d);
    o.connect(g).connect(ac.destination); o.start(s); o.stop(s + d);
  } catch {}
}
const sfx = { tap: s => tone(s === 1 ? 700 : s === 2 ? 330 : 500, 0, .07, 'triangle'), no: () => tone(150, 0, .3, 'sawtooth', .06), win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .11, .3, 'triangle', .12)) };
$('snd').textContent = muted ? '🔇' : '🔊';
$('snd').onclick = () => { muted = !muted; $('snd').textContent = muted ? '🔇' : '🔊'; try { localStorage.setItem('ll-mute', muted ? '1' : '0'); } catch {} sfx.tap(0); };

// ---- Seeded random so the daily puzzle is the same for everyone ----
function seeded(seed){ let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---- Puzzle engine: t[i] is true when resident i is honest. A resident's statement must be true if honest, false if a liar ----
const NAMES = ['Ruby', 'Milo', 'Pip', 'Nina', 'Otto', 'Zoe', 'Finn', 'Bea'], FACES = ['🐶', '🐱', '🦊', '🐼', '🐸', '🐵', '🦁', '🐯'];
function evalS(s, i, t){
  const liars = t.filter(x => !x).length, N = t.length;
  switch (s.k) {
    case 'L': return !t[s.a];
    case 'H': return t[s.a];
    case 'BL': return !t[s.a] && !t[s.b];
    case 'BH': return t[s.a] && t[s.b];
    case 'SAME': return t[s.a] === t[s.b];
    case 'DIFF': return t[s.a] !== t[s.b];
    case 'ANYL': return !t[s.a] || !t[s.b];
    case 'COUNT': return liars === s.n;
    case 'MOREH': return N - liars > liars;
    case 'LEFTH': return t.slice(0, i).every(Boolean);
    case 'RIGHTL': return t.slice(i + 1).every(x => !x);
  }
}
function textS(s, names){
  const n = x => `<b>${names[x]}</b>`;
  switch (s.k) {
    case 'L': return `${n(s.a)} is a liar.`;
    case 'H': return `${n(s.a)} is honest.`;
    case 'BL': return `${n(s.a)} and ${n(s.b)} are both liars.`;
    case 'BH': return `${n(s.a)} and ${n(s.b)} are both honest.`;
    case 'SAME': return `${n(s.a)} and ${n(s.b)} are the same kind.`;
    case 'DIFF': return `${n(s.a)} and ${n(s.b)} are different kinds.`;
    case 'ANYL': return `At least one of ${n(s.a)} and ${n(s.b)} is a liar.`;
    case 'COUNT': return s.n === 0 ? 'None of us is a liar.' : s.n === 1 ? 'Exactly one of us is a liar.' : `Exactly ${s.n} of us are liars.`;
    case 'MOREH': return 'Most of us are honest.';
    case 'LEFTH': return 'Everyone to my left is honest.';
    case 'RIGHTL': return 'Everyone to my right is a liar.';
  }
}
function randStmt(i, N, kinds, rnd){
  const k = kinds[rnd() * kinds.length | 0], others = [...Array(N).keys()].filter(x => x !== i);
  const pick = () => others[rnd() * others.length | 0];
  if (k === 'L' || k === 'H') return { k, a: pick() };
  if (['BL', 'BH', 'SAME', 'DIFF', 'ANYL'].includes(k)) { const a = pick(); let b = pick(); while (b === a) b = pick(); return { k, a, b }; }
  if (k === 'COUNT') return { k, n: rnd() * (N + 1) | 0 };
  if (k === 'LEFTH') return i === 0 ? null : { k };
  if (k === 'RIGHTL') return i === N - 1 ? null : { k };
  return { k };
}
const KINDS = [['L', 'H', 'SAME', 'DIFF'], ['L', 'H', 'BL', 'BH', 'SAME', 'DIFF'], ['L', 'H', 'BL', 'BH', 'SAME', 'DIFF', 'ANYL', 'COUNT', 'LEFTH', 'RIGHTL'], ['L', 'H', 'BL', 'BH', 'SAME', 'DIFF', 'ANYL', 'COUNT', 'LEFTH', 'RIGHTL', 'MOREH']];
const sizeOf = lv => lv <= 2 ? 3 : lv <= 5 ? 4 : lv <= 9 ? 5 : lv <= 14 ? 6 : lv <= 20 ? 7 : 8;
const tierOf = lv => lv <= 2 ? 0 : lv <= 6 ? 1 : lv <= 12 ? 2 : 3;
function countSolutions(stmts){
  const N = stmts.length; let n = 0;
  for (let m = 0; m < 1 << N; m++) {
    const t = Array.from({ length: N }, (_, j) => !!(m >> j & 1));
    if (stmts.every((s, i) => evalS(s, i, t) === t[i])) n++;
  }
  return n;
}
function genPuzzle(N, tier, rnd){
  for (let attempt = 0; attempt < 400; attempt++) {
    const kinds = KINDS[Math.min(3, tier + (attempt > 120 ? 1 : 0) + (attempt > 260 ? 1 : 0))];
    let t; do t = Array.from({ length: N }, () => rnd() < .5); while (t.every(Boolean) || t.every(x => !x));
    const make = i => { for (let k = 0; k < 120; k++) { const s = randStmt(i, N, kinds, rnd); if (s && evalS(s, i, t) === t[i]) return s; } return null; };
    const stmts = [];
    for (let i = 0; i < N; i++) { const s = make(i); if (!s) break; stmts.push(s); }
    if (stmts.length < N) continue;
    let sols = countSolutions(stmts);
    for (let it = 0; it < 500 && sols > 1; it++) {            // keep swapping one statement while it narrows down the possibilities
      const i = rnd() * N | 0, s = make(i); if (!s) continue;
      const old = stmts[i]; stmts[i] = s; const ns = countSolutions(stmts);
      if (ns <= sols) sols = ns; else stmts[i] = old;
    }
    if (sols === 1) return { t, stmts };
  }
  return null;
}
function buildPuzzle(level, rnd, N){
  N ??= sizeOf(level); const tier = tierOf(level);
  const p = genPuzzle(N, tier, rnd) ?? genPuzzle(N, 3, rnd) ?? genPuzzle(3, 1, rnd);
  const idx = [...Array(NAMES.length).keys()].sort(() => rnd() - .5).slice(0, p.t.length);     // residents are drawn in random order
  return { ...p, names: idx.map(i => NAMES[i]), faces: idx.map(i => FACES[i]) };
}

// ---- State ----
let level = 1, P, marks, locked, strikes, hints, solvedCount = 0, daily = false, dailyKey = '';
try { level = +localStorage.getItem('ll-level') || 1; } catch {}

function newPuzzle(){
  daily = false; P = buildPuzzle(level, Math.random); resetBoard();
}
function newDaily(){
  const d = new Date(), key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  daily = true; dailyKey = key; P = buildPuzzle(10, seeded(+key.replace(/-/g, '')), 6); resetBoard();
}
function resetBoard(){ marks = P.t.map(() => 0); locked = P.t.map(() => false); strikes = 0; hints = 0; render(); }

function render(){
  $('lv').textContent = daily ? 'Daily' : level;
  $('hearts').textContent = '❤️'.repeat(3 - strikes) + '🖤'.repeat(strikes);
  $('street').innerHTML = P.stmts.map((s, i) => {
    const st = marks[i], badge = st === 1 ? '😇' : st === 2 ? '😈' : '❓';
    return `<button class="res${locked[i] ? ' lock' : ''}" data-i="${i}" data-s="${st}" style="margin-bottom:10px" aria-label="${P.names[i]}, ${['unmarked', 'marked honest', 'marked liar'][st]}. Says: ${textS(s, P.names).replace(/<[^>]+>/g, '')}">` +
      `<span class="face"><span class="av">${P.faces[i]}<span class="badge">${badge}</span></span><div class="nm">${P.names[i]}</div><span class="tag">${['?', 'HONEST', 'LIAR'][st]}</span></span>` +
      `<span class="bubble">${textS(s, P.names)}</span></button>`;
  }).join('');
}
$('street').onclick = e => {
  const r = e.target.closest('.res'); if (!r) return; ac?.resume?.();
  const i = +r.dataset.i; if (locked[i]) { toast('Hinted residents are locked'); return; }
  marks[i] = (marks[i] + 1) % 3; sfx.tap(marks[i]); render();
};
$('clear').onclick = () => { marks = marks.map((m, i) => locked[i] ? m : 0); render(); };
$('hint').onclick = () => Ads.rewarded(() => {
  const open = P.t.map((_, i) => i).filter(i => !locked[i]); if (!open.length) return;
  const i = open[Math.random() * open.length | 0]; marks[i] = P.t[i] ? 1 : 2; locked[i] = true; hints++; render(); toast(`${P.names[i]} is ${P.t[i] ? 'honest' : 'a liar'}`);
});

// ---- Accuse: the answer fits only if every statement agrees with the marked types ----
$('accuse').onclick = () => {
  if (marks.some(m => !m)) { toast('Mark every resident first'); return; }
  const t = marks.map(m => m === 1), bad = P.stmts.map((s, i) => evalS(s, i, t) !== t[i]);
  if (!bad.some(Boolean)) return solved();
  strikes++; sfx.no(); render();
  document.querySelectorAll('.res').forEach((r, i) => bad[i] && r.classList.add('bad'));
  toast('The red statements do not fit your marks');
  if (strikes >= 3) setTimeout(failed, 900);
};
function stars(){ return Math.max(1, 3 - strikes - (hints ? 1 : 0)); }
function solved(){
  sfx.win(); const s = stars(); solvedCount++;
  const share = `Liars Lane ${dailyKey}  ${'⭐'.repeat(s)}${'🖤'.repeat(strikes)}`;
  if (daily) { try { localStorage.setItem('ll-daily', dailyKey); } catch {} }
  else { level++; try { localStorage.setItem('ll-level', level); } catch {} }
  overlay(`<div class="stars">${'★'.repeat(s)}${'☆'.repeat(3 - s)}</div><h2>Case solved!</h2><p>${strikes ? `${strikes} strike${strikes > 1 ? 's' : ''}` : 'No strikes'}${hints ? ` · ${hints} hint${hints > 1 ? 's' : ''}` : ''}</p>` +
    (daily ? `<button class="btn wide green" id="share">Copy result to share</button><button class="btn wide blue" id="menu">Back</button>`
           : `<button class="btn wide green" id="next">Next puzzle</button>`));
  if (daily) { $('share').onclick = () => { navigator.clipboard?.writeText(share).then(() => toast('Copied!'), () => toast(share)); }; $('menu').onclick = () => { hide(); start(); }; }
  else $('next').onclick = () => { hide(); Ads.interstitial(newPuzzle); };
}
function failed(){
  const chips = P.names.map((n, i) => `<span>${P.faces[i]} ${n}: ${P.t[i] ? '😇 honest' : '😈 liar'}</span>`).join('');
  overlay(`<div class="big-emoji">🕵️</div><h2>Out of strikes</h2><p>Here was the truth:</p><div class="sol">${chips}</div>` +
    `<button class="btn wide green" id="again">${daily ? 'Back' : 'Try a new puzzle'}</button>`);
  $('again').onclick = () => { hide(); daily ? start() : newPuzzle(); };
}
$('help').onclick = () => { overlay(`<h2>How to play</h2><p>Every resident is either <b>honest</b> (always tells the truth) or a <b>liar</b> (always lies).</p><p>Each one makes a statement. Work out who is who: tap a resident to mark them 😇 or 😈.</p><p>Press <b>Accuse</b> when everyone is marked. Red statements show where your marks don't fit. Three strikes and the case goes cold!</p><button class="btn wide green" id="okh">Got it</button>`); $('okh').onclick = hide; };
document.addEventListener('visibilitychange', () => { if (document.hidden && $('overlay').hidden) { overlay('<h2>Paused</h2><button class="btn wide" id="res">Resume</button>'); $('res').onclick = hide; } });

function start(){
  let doneToday = false; try { const d = new Date(); doneToday = localStorage.getItem('ll-daily') === `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; } catch {}
  overlay(`<h1>Liars<br>Lane</h1><p>Someone on this street is lying. Use logic to find out who.</p>` +
    `<button class="btn wide green big" id="play">${level > 1 ? 'Continue · level ' + level : 'Play'}</button>` +
    `<button class="btn wide blue" id="dly">📅 Daily puzzle ${doneToday ? '✔' : ''}</button>`);
  $('play').onclick = () => { ac?.resume?.(); hide(); newPuzzle(); };
  $('dly').onclick = () => { ac?.resume?.(); hide(); newDaily(); };
}
newPuzzle(); start();
</script>
<script>
/* Portal adapter. Injected by build.py after each game's own script.
 * It replaces the game's placeholder `Ads` with the portal SDK and reports gameplay start/stop.
 * window.PORTAL_TARGET is set by the build: 'poki' | 'crazygames'. Without it (dev builds) nothing happens. */
(() => {
  const target = window.PORTAL_TARGET;
  if (target === 'site') {                    // my own website: no ads, so hints, undo and revive are simply free
    if (typeof Ads !== 'undefined') { Ads.interstitial = done => done(); Ads.rewarded = done => done(); }
    document.head.insertAdjacentHTML('beforeend', '<style>.btn>i{display:none!important}</style>');   // hides the "AD" badges
    return;
  }
  if (!['poki', 'crazygames'].includes(target) || typeof Ads === 'undefined') return;

  // ---- Audio: head.js tracked every AudioContext the game created, so they can be silenced during ads ----
  const ctxs = window.__portalCtxs || [];
  const audio = on => ctxs.forEach(c => { try { on ? c.resume() : c.suspend(); } catch {} });

  // ---- Shield: blocks input while an ad is loading or playing ----
  const shield = document.createElement('div');
  shield.style.cssText = 'position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;color:#fff;font:700 20px system-ui,sans-serif';
  document.body.append(shield);
  const shieldOn = dark => { shield.style.display = 'flex'; shield.style.background = dark ? '#000b' : 'transparent'; shield.textContent = dark ? 'Ad playing…' : ''; };
  const shieldOff = () => { shield.style.display = 'none'; };
  function toast(text){
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000d;color:#fff;border-radius:99px;padding:10px 18px;z-index:100000;font:700 15px system-ui,sans-serif';
    t.textContent = text; document.body.append(t); setTimeout(() => t.remove(), 2200);
  }

  // ---- Gameplay start/stop follows the game's #overlay: menus, game over and pause cards are "not playing" ----
  let playing = false, adActive = false, sdk;
  const overlayEl = document.getElementById('overlay');
  function sync(){
    const should = !adActive && !!overlayEl && overlayEl.hidden;
    if (should && !playing) { playing = true; sdk.start(); }
    else if (!should && playing) { playing = false; sdk.stop(); }
  }
  if (overlayEl) new MutationObserver(sync).observe(overlayEl, { attributes: true, attributeFilter: ['hidden'] });

  // ---- One ad flow for both portals: `request(kind, hooks)` is portal specific ----
  function runAd(kind, onReward, onDone){
    adActive = true; sync(); shieldOn(false);
    let finished = false;
    const end = rewarded => {
      if (finished) return; finished = true;
      audio(true); shieldOff(); adActive = false;
      if (kind === 'rewarded') rewarded ? onReward() : toast('Reward not earned: the ad was unavailable or skipped');
      else onDone();
      sync();
    };
    const start = () => { audio(false); shieldOn(true); };
    try { sdk.request(kind, start, end); } catch { end(false); }
  }
  Ads.interstitial = done => runAd('midgame', null, done);
  Ads.rewarded = done => runAd('rewarded', done, null);

  // ---- Portal SDKs ----
  if (target === 'poki') {
    const P = () => window.PokiSDK;
    sdk = {
      start: () => P()?.gameplayStart?.(),
      stop: () => P()?.gameplayStop?.(),
      request(kind, onStart, end){
        if (!P()) return end(kind !== 'rewarded');              // SDK blocked: interstitials just continue, rewards are not given
        if (kind === 'midgame') Promise.resolve(P().commercialBreak(onStart)).then(() => end(true), () => end(true));
        else {                                                  // accept both the callback and the options form of rewardedBreak
          const opts = Object.assign(() => onStart(), { onStart, size: 'small' });
          Promise.resolve(P().rewardedBreak(opts)).then(ok => end(!!ok), () => end(false));
        }
      },
    };
    if (location.hostname === 'localhost') P()?.setDebug?.(true);
    Promise.resolve(P()?.init?.()).then(() => P()?.gameLoadingFinished?.(), () => P()?.gameLoadingFinished?.());
  } else if (target === 'crazygames') {
    const C = () => window.CrazyGames?.SDK;
    sdk = {
      start: () => C()?.game?.gameplayStart?.(),
      stop: () => C()?.game?.gameplayStop?.(),
      request(kind, onStart, end){
        if (!C()) return end(kind !== 'rewarded');
        C().ad.requestAd(kind, { adStarted: onStart, adFinished: () => end(true), adError: () => end(kind !== 'rewarded') });
      },
    };
    Promise.resolve(C()?.init?.()).then(() => { C()?.game?.loadingStart?.(); C()?.game?.loadingStop?.(); }, () => {});
  } else return;

  // Keyboard is disabled while an ad runs (Poki asks for this); the capture phase runs before the game's own handlers
  for (const type of ['keydown', 'keyup']) addEventListener(type, e => { if (adActive) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  // The page sits in an iframe: stop arrow keys and space from scrolling the host page. The wheel is only blocked for
  // canvas games, because the two puzzle games with long pages need to scroll on small screens.
  addEventListener('keydown', e => { if ([' ', 'ArrowUp', 'ArrowDown'].includes(e.key) && e.target === document.body) e.preventDefault(); });
  if (document.querySelector('canvas')) addEventListener('wheel', e => e.preventDefault(), { passive: false });
  sync();
})();

</script>
</body>
</html>
