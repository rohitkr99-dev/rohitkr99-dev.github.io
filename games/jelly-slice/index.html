<!doctype html>
<html lang="en">
<head>
<script>window.PORTAL_TARGET='site'</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a0f45">
<title>Jelly Slice</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0620}
body{display:grid;place-items:center;touch-action:none;
  font:800 16px "Fredoka","Baloo 2",ui-rounded,"Segoe UI Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;color:#fff}
canvas{display:block;border-radius:14px;box-shadow:0 10px 40px #000a;touch-action:none;cursor:crosshair}
.btn{font:inherit;color:#4a2f00;background:linear-gradient(#ffe066,#ffb300);border:0;border-bottom:5px solid #c78500;border-radius:14px;padding:10px 16px;cursor:pointer;position:relative;
  box-shadow:0 6px 12px #0003;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn.green{color:#fff;background:linear-gradient(#6be585,#1fa94b);border-bottom-color:#127a32}
.btn.blue{color:#fff;background:linear-gradient(#5ec2ff,#2a7de1);border-bottom-color:#1a55a0}
.btn.big{font-size:22px;padding:14px 36px;display:block;width:100%;margin-top:12px}
.btn i{position:absolute;top:-8px;right:-6px;font-style:normal;font-size:11px;color:#fff;background:#e0364e;border-radius:99px;padding:2px 7px}
#bar{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:5}
#bar .btn{min-width:96px;padding:10px 12px;font-size:15px}
#overlay{position:fixed;inset:0;background:#0a051bb8;display:grid;place-items:center;padding:16px;z-index:60;backdrop-filter:blur(3px)}
#overlay[hidden]{display:none}
#card{background:#fff;color:#2a1560;border-radius:28px;padding:26px 32px 30px;text-align:center;max-width:350px;box-shadow:0 20px 50px #0006;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
#card h1{font-size:50px;line-height:.95;margin:0 0 8px;color:#8a3df0}
#card h2{margin:6px 0;font-size:28px}
#card p{margin:6px 0;font-size:17px;opacity:.75}
#card .score{font-size:60px;line-height:1;color:#8a3df0;margin:4px 0}
#card .how{text-align:left;font-size:16px;margin:12px 0 4px;padding-left:20px;opacity:.85}
#card .how li{margin:4px 0}
.adbar{height:10px;border-radius:9px;background:#0001;overflow:hidden;margin-top:14px}
.adbar i{display:block;height:100%;background:#2a7de1;animation:fill 1.5s linear forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes fill{from{width:0}to{width:100%}}
</style>
</head>
<body>
<canvas id="c" aria-label="Jelly Slice game"></canvas>
<div id="bar"><button class="btn blue" id="pause">⏸ Pause</button></div>
<div id="overlay" hidden><div id="card" role="dialog" aria-live="polite"></div></div>

<script>
const W = 480, H = 720, G = 1100;
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const rand = (a, b) => a + Math.random() * (b - a);
const FONT = '"Fredoka","Baloo 2",ui-rounded,"Segoe UI Rounded","Trebuchet MS",system-ui,sans-serif';

function fit(){
  const s = Math.min(innerWidth / W, (innerHeight - 70) / H), d = devicePixelRatio || 1;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * d); cv.height = Math.round(H * s * d);
}
addEventListener('resize', fit); fit();

// ---- Overlay + Ads: replace the two Ads bodies with the portal SDK (e.g. Poki commercialBreak / rewardedBreak) ----
function overlay(html){ $('card').innerHTML = html; $('overlay').hidden = false; }
const hide = () => { $('overlay').hidden = true; };
function adBreak(title, done){
  overlay(`<p>${title}</p><h2>Placeholder ad</h2><div class="adbar"><i></i></div>`);
  setTimeout(() => { hide(); done(); }, 1500);
}
let adCalls = 0;   // placeholder ads: show one break in two
const Ads = { interstitial: done => ++adCalls % 2 ? done() : adBreak('Advertisement', done), rewarded: done => adBreak('Watch to continue', done) };

// ---- Sound ----
let ac;
function tone(f, t = 0, d = .1, type = 'sine', v = .08){
  try {
    ac ??= new AudioContext();
    const o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + t;
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(.001, s + d);
    o.connect(g).connect(ac.destination); o.start(s); o.stop(s + d);
  } catch {}
}
const sfx = {
  slice: n => { tone(500 + n * 110, 0, .12, 'triangle', .1); tone(900 + n * 160, .04, .1, 'sine', .05); },
  bomb: () => { tone(110, 0, .5, 'sawtooth', .12); tone(70, 0, .6, 'square', .08); },
  miss: () => tone(170, 0, .25, 'square', .06),
  target: () => { tone(784, 0, .12, 'triangle', .08); tone(1047, .1, .16, 'triangle', .08); },
  over: () => [440, 370, 311, 220].forEach((f, i) => tone(f, i * .16, .3, 'triangle', .1)),
};

// ---- Jellies: each type has its own colour AND its own shape, so colour-blind players can tell them apart ----
const COL = ['#ff5fa2', '#2fd0ff', '#8be83d', '#ffa630', '#a66bff'];
const NAME = ['Ball', 'Cube', 'Star', 'Heart', 'Drop'];

function shapePath(r, ci){
  ctx.beginPath();
  if (ci === 0) ctx.arc(0, 0, r, 0, 7);
  else if (ci === 1) ctx.roundRect(-r * .85, -r * .85, r * 1.7, r * 1.7, r * .35);
  else if (ci === 2) for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, d = k % 2 ? r * .52 : r * 1.12; ctx[k ? 'lineTo' : 'moveTo'](Math.cos(a) * d, Math.sin(a) * d); }
  else if (ci === 3) { ctx.moveTo(0, r * .95); ctx.bezierCurveTo(-r * 1.45, r * .1, -r * .95, -r * 1.05, 0, -r * .38); ctx.bezierCurveTo(r * .95, -r * 1.05, r * 1.45, r * .1, 0, r * .95); }
  else { ctx.moveTo(0, -r * 1.2); ctx.bezierCurveTo(r * .3, -r * .6, r * .95, -r * .1, r * .95, r * .3); ctx.arc(0, r * .3, r * .95, 0, Math.PI); ctx.bezierCurveTo(-r * .95, -r * .1, -r * .3, -r * .6, 0, -r * 1.2); }
  ctx.closePath();
}
function drawGem(r, ci, glow){
  ctx.save();
  shapePath(r, ci);
  if (glow) { ctx.shadowColor = COL[ci]; ctx.shadowBlur = 18; }
  ctx.fillStyle = COL[ci]; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.save(); ctx.clip();
  const g = ctx.createRadialGradient(-r * .3, -r * .4, r * .1, 0, 0, r * 1.3);
  g.addColorStop(0, 'rgba(255,255,255,.6)'); g.addColorStop(.5, 'rgba(255,255,255,.05)'); g.addColorStop(1, 'rgba(0,0,0,.28)');
  ctx.fillStyle = g; ctx.fillRect(-r * 2, -r * 2, r * 4, r * 4); ctx.restore();
  shapePath(r, ci); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-r * .35, -r * .4, r * .2, r * .1, -.7, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fill();
  ctx.restore();
}
function drawBomb(r, tm){                                       // spiky urchin
  ctx.save();
  ctx.beginPath();
  for (let k = 0; k < 24; k++) { const a = k * Math.PI / 12, d = k % 2 ? r * .7 : r * 1.12; ctx[k ? 'lineTo' : 'moveTo'](Math.cos(a) * d, Math.sin(a) * d); }
  ctx.closePath(); ctx.fillStyle = '#3a2a4d'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#ff3b4d'; ctx.stroke();
  const blink = Math.sin(tm * 5) > .92;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(s * r * .28, -r * .08, r * .17, blink ? r * .03 : r * .2, 0, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
    if (!blink) { ctx.beginPath(); ctx.arc(s * r * .28, -r * .02, r * .08, 0, 7); ctx.fillStyle = '#ff3b4d'; ctx.fill(); }
  }
  ctx.beginPath(); ctx.moveTo(-r * .5, -r * .38); ctx.lineTo(-r * .1, -r * .22); ctx.moveTo(r * .5, -r * .38); ctx.lineTo(r * .1, -r * .22);
  ctx.lineWidth = 3; ctx.strokeStyle = '#ff3b4d'; ctx.stroke();
  ctx.restore();
}

// ---- State ----
let targetMax = 10, state = 'menu', items, halves, parts, texts, trail, score, lives, t, target, targetT, spawnT, revived, flash, stroke, down, last;
let best = 0; try { best = +localStorage.getItem('jelly-best') || 0; } catch {}
const colorsAt = () => t < 10 ? 3 : t < 28 ? 4 : 5;
const diff = () => Math.min(1, t / 70);
const say = (s, x, y, c = '#fff', size = 26) => texts.push({ s, x, y, c, size, life: 1 });

function reset(){
  items = []; halves = []; parts = []; texts = []; trail = [];
  score = 0; lives = 3; t = 0; spawnT = .6; revived = false; flash = 0; stroke = { c: -1, n: 0 }; down = false; last = null;
  target = 0; pickTarget(true);
}
function pickTarget(first){
  const n = colorsAt(); let c;
  do { c = Math.random() * n | 0; } while (c === target && !first);
  target = c; targetT = targetMax = 10 - 5 * diff();
  if (!first) { sfx.target(); say('Target: ' + NAME[c], W / 2, 112, COL[c], 24); }
}

// ---- Spawning ----
function wave(){
  const d = diff(), n = 1 + (Math.random() * (1.8 + 3.2 * d) | 0), nc = colorsAt(), list = [];
  const pairColor = n >= 2 && Math.random() < .35 ? Math.random() * nc | 0 : -1;
  for (let i = 0; i < n; i++) {
    const bomb = i > 0 && Math.random() < .12 + .3 * d;
    const ci = bomb ? -1 : (pairColor >= 0 && i < 2 ? pairColor : Math.random() * nc | 0);
    list.push({ kind: bomb ? 'bomb' : 'gem', ci });
  }
  if (!list.some(o => o.kind === 'gem' && o.ci === target) && Math.random() < .4) { const g = list.find(o => o.kind === 'gem'); if (g) g.ci = target; }
  let prev = null;                                          // an urchin flies right next to the previous jelly, so a careless swipe hits both
  list.forEach((o, i) => {
    const near = o.kind === 'bomb' && prev;
    const x = near ? Math.max(40, Math.min(W - 40, prev.x + rand(-60, 60))) : rand(60, W - 60), hgt = near ? prev.hgt + rand(-50, 50) : rand(420, 680);
    items.push({ ...o, x, y: H + 40, r: o.kind === 'bomb' ? 28 : 31 - 4 * d, vx: near ? prev.vx + rand(-30, 30) : (W / 2 - x) * rand(.15, .45) + rand(-40, 40),
      vy: -Math.sqrt(2 * G * hgt), rot: rand(0, 6), spin: rand(-3, 3), wait: near ? prev.wait + rand(0, .12) : i * rand(.08, .2) });
    if (!near) prev = { x, hgt, vx: items[items.length - 1].vx, wait: items[items.length - 1].wait };
  });
}

// ---- Slicing ----
function segDist(p, a, b){
  const dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy;
  const k = l ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l)) : 0;
  return Math.hypot(p.x - a.x - k * dx, p.y - a.y - k * dy);
}
function burst(x, y, color, n){
  for (let i = 0; i < n; i++) { const a = rand(0, 7), s = rand(80, 320); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: rand(.3, .7), c: color }); }
}
function slice(a, b){
  if (Math.hypot(b.x - a.x, b.y - a.y) < 2) return;
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const hit = items.filter(o => o.wait <= 0 && segDist(o, a, b) < o.r + 8)
    .sort((p, q) => Math.hypot(p.x - a.x, p.y - a.y) - Math.hypot(q.x - a.x, q.y - a.y));
  for (const o of hit) {
    items.splice(items.indexOf(o), 1);
    if (o.kind === 'bomb') {
      lives--; flash = 1; stroke = { c: -1, n: 0 }; sfx.bomb(); burst(o.x, o.y, '#ff6a3d', 30); say('Ouch, spikes!', o.x, o.y, '#ff6a6a', 28);
      continue;
    }
    if (stroke.c === o.ci) stroke.n++;
    else { if (stroke.n >= 2) say('Chain broken', o.x, o.y - 40, '#ffffff99', 18); stroke = { c: o.ci, n: 1 }; }
    const pts = (o.ci === target ? 3 : 1) * stroke.n;
    score += pts;
    sfx.slice(Math.min(stroke.n, 6));
    burst(o.x, o.y, COL[o.ci], 14);
    say('+' + pts + (stroke.n > 1 ? '  ×' + stroke.n : ''), o.x, o.y, o.ci === target ? '#fff' : COL[o.ci], 22 + stroke.n * 3);
    for (const side of [1, -1]) halves.push({ x: o.x, y: o.y, vx: o.vx + Math.cos(ang + Math.PI / 2) * 130 * side, vy: o.vy * .5 + Math.sin(ang + Math.PI / 2) * 130 * side,
      rot: o.rot, spin: o.spin + side * 2, r: o.r, ci: o.ci, cut: ang - o.rot, side, life: 1.1 });
  }
}

// ---- Update ----
function update(dt){
  t += dt;
  if ((spawnT -= dt) <= 0) { wave(); spawnT = 1.25 - .7 * diff() + rand(0, .2); }
  if ((targetT -= dt) <= 0) pickTarget();
  for (const o of items) {
    if (o.wait > 0) { o.wait -= dt; continue; }
    o.x += o.vx * dt; o.y += o.vy * dt; o.vy += G * dt; o.rot += o.spin * dt;
    if (o.x < o.r) { o.x = o.r; o.vx = Math.abs(o.vx); } else if (o.x > W - o.r) { o.x = W - o.r; o.vx = -Math.abs(o.vx); }
  }
  items = items.filter(o => {
    if (o.wait <= 0 && o.y > H + o.r + 10 && o.vy > 0) {
      if (o.kind === 'gem' && o.ci === target) { lives--; flash = .6; sfx.miss(); say('Missed it!', Math.max(80, Math.min(W - 80, o.x)), H - 90, '#ff8a8a', 26); }
      return false;
    }
    return true;
  });
  for (const h of halves) { h.x += h.vx * dt; h.y += h.vy * dt; h.vy += G * dt; h.rot += h.spin * dt; h.life -= dt; }
  halves = halves.filter(h => h.life > 0 && h.y < H + 80);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const s of texts) { s.y -= 40 * dt; s.life -= dt * 1.1; }
  texts = texts.filter(s => s.life > 0);
  trail = trail.filter(p => performance.now() - p.t < 200);
  flash = Math.max(0, flash - dt * 2.2);
  if (lives <= 0) gameOver();
}

// ---- Draw ----
const stars = Array.from({ length: 40 }, () => ({ x: rand(0, W), y: rand(0, H), r: rand(.6, 2), s: rand(.2, 1) }));
function drawBg(tm){
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#3a1457'); g.addColorStop(1, '#12386e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars) { ctx.globalAlpha = .25 + .25 * Math.sin(tm * s.s * 2 + s.x); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = .07; ctx.fillStyle = '#ff9bd0';
  [[70, 90], [190, 50], [330, 110], [430, 65], [250, 80]].forEach(([x, r], i) => { ctx.beginPath(); ctx.arc(x, (H + r - (tm * (14 + i * 5) + i * 160)) % (H + 2 * r) , r, 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1;
}
function drawHalf(h){
  ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.rot); ctx.globalAlpha = Math.min(1, h.life * 2);
  ctx.rotate(h.cut); ctx.beginPath(); ctx.rect(-h.r * 2, h.side > 0 ? 0 : -h.r * 2, h.r * 4, h.r * 2); ctx.clip(); ctx.rotate(-h.cut);
  drawGem(h.r, h.ci); ctx.restore();
}
function hud(tm){
  ctx.textBaseline = 'middle';
  for (let i = 0; i < 3; i++) { ctx.font = `800 30px ${FONT}`; ctx.textAlign = 'left'; ctx.fillStyle = i < lives ? '#ff4d6d' : 'rgba(255,255,255,.18)'; ctx.fillText('♥', 14 + i * 32, 36); }
  ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = `800 36px ${FONT}`; ctx.fillText(score, W - 16, 34);
  ctx.font = `800 14px ${FONT}`; ctx.fillStyle = '#ffffff99'; ctx.fillText('BEST ' + Math.max(best, score), W - 16, 62);
  const px = W / 2 - 70, py = 14, pulse = targetMax - targetT < 1.2 ? 1 + .08 * Math.sin(tm * 18) : 1;
  ctx.save(); ctx.translate(W / 2, py + 28); ctx.scale(pulse, pulse); ctx.translate(-W / 2, -py - 28);
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.roundRect(px, py, 140, 56, 16); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.font = `800 17px ${FONT}`; ctx.fillText('SLICE', px + 14, py + 28);
  ctx.translate(px + 104, py + 28); drawGem(17, target, true); ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(px, py + 62, 140, 4);
  ctx.fillStyle = COL[target]; ctx.fillRect(px, py + 62, 140 * Math.max(0, targetT) / targetMax, 4);
}
function draw(tm){
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.save();
  drawBg(tm);
  if (items) {
    for (const h of halves) drawHalf(h);
    for (const o of items) {
      if (o.wait > 0) continue;
      ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.rot);
      if (o.kind === 'bomb') drawBomb(o.r, tm); else drawGem(o.r, o.ci, o.ci === target);
      ctx.restore();
    }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x - 2.5, p.y - 2.5, 5, 5); }
    ctx.globalAlpha = 1;
    if (trail.length > 1) {
      const now = performance.now();
      ctx.lineCap = 'round';
      for (let i = 1; i < trail.length; i++) {
        const k = 1 - (now - trail[i].t) / 200;
        ctx.strokeStyle = `rgba(190,235,255,${Math.max(0, k)})`; ctx.lineWidth = 3 + 9 * k; ctx.shadowColor = '#8fd8ff'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const s of texts) { ctx.globalAlpha = Math.min(1, s.life * 1.5); ctx.font = `800 ${s.size}px ${FONT}`; ctx.lineWidth = 5; ctx.strokeStyle = '#0008'; ctx.strokeText(s.s, s.x, s.y); ctx.fillStyle = s.c; ctx.fillText(s.s, s.x, s.y); }
    ctx.globalAlpha = 1;
    if (flash > 0) { ctx.fillStyle = `rgba(255,40,70,${flash * .35})`; ctx.fillRect(0, 0, W, H); }
    hud(tm);
  }
  ctx.restore();
}

let prev = performance.now();
function loop(now){
  const dt = Math.min(.033, (now - prev) / 1000); prev = now;
  if (state === 'play' && $('overlay').hidden) update(dt);
  draw(now / 1000);
  requestAnimationFrame(loop);
}

// ---- Flow ----
function menu(){
  state = 'menu';
  overlay(`<h1>Jelly<br>Slice</h1><p>Swipe to slice the jellies.</p>
    <ul class="how"><li><b>Target shape</b> (top): worth 3 points. Miss it and you lose a ♥.</li>
    <li>Other jellies are worth 1 and can fall freely.</li>
    <li>Slice the <b>same jelly</b> again and again in one swipe for ×2, ×3…</li>
    <li>Never touch the <b>spiky urchins</b>.</li></ul>
    <button class="btn green big" id="go">Play</button>`);
  $('go').onclick = () => { reset(); hide(); state = 'play'; };
}
function gameOver(){
  state = 'over'; sfx.over();
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('jelly-best', best); } catch {} }
  overlay(`<h2>Out of hearts</h2><div class="score">${score}</div><p>${isBest ? '★ New best!' : 'Best: ' + best}</p>
    ${revived ? '' : '<button class="btn blue big" id="rev">♥ Continue <i>AD</i></button>'}
    <button class="btn green big" id="again">Play again</button>`);
  const rev = $('rev');
  if (rev) rev.onclick = () => Ads.rewarded(() => { hide(); revived = true; lives = 1; items = items.filter(o => o.kind !== 'bomb'); flash = 0; state = 'play'; });
  $('again').onclick = () => Ads.interstitial(() => { reset(); hide(); state = 'play'; });
}
function pause(){
  if (state !== 'play' || !$('overlay').hidden) return;
  overlay('<h2>Paused</h2><button class="btn green big" id="res">Resume</button>');
  $('res').onclick = hide;
}
$('pause').onclick = pause;
addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'p') { $('overlay').hidden ? pause() : (state === 'play' && hide()); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

// ---- Input ----
const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || !$('overlay').hidden) return;
  cv.setPointerCapture(e.pointerId); down = true; stroke = { c: -1, n: 0 }; last = pt(e); trail.push({ ...last, t: performance.now() });
});
cv.addEventListener('pointermove', e => {
  if (!down || state !== 'play' || !$('overlay').hidden) return;
  const p = pt(e); slice(last, p); last = p; trail.push({ ...p, t: performance.now() });
});
const up = () => { down = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('lostpointercapture', up);

reset(); menu();
requestAnimationFrame(loop);
</script>
<script>
/* Portal adapter. Injected by build.py after each game's own script.
 * It replaces the game's placeholder `Ads` with the portal SDK and reports gameplay start/stop.
 * window.PORTAL_TARGET is set by the build: 'poki' | 'crazygames'. Without it (dev builds) nothing happens. */
(() => {
  const target = window.PORTAL_TARGET;
  if (target === 'site') {                    // my own website: no ads, so hints, undo and revive are simply free
    if (typeof Ads !== 'undefined') { Ads.interstitial = done => done(); Ads.rewarded = done => done(); }
    document.head.insertAdjacentHTML('beforeend', '<style>.btn>i{display:none!important}</style>');   // hides the "AD" badges
    return;
  }
  if (!['poki', 'crazygames'].includes(target) || typeof Ads === 'undefined') return;

  // ---- Audio: head.js tracked every AudioContext the game created, so they can be silenced during ads ----
  const ctxs = window.__portalCtxs || [];
  const audio = on => ctxs.forEach(c => { try { on ? c.resume() : c.suspend(); } catch {} });

  // ---- Shield: blocks input while an ad is loading or playing ----
  const shield = document.createElement('div');
  shield.style.cssText = 'position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;color:#fff;font:700 20px system-ui,sans-serif';
  document.body.append(shield);
  const shieldOn = dark => { shield.style.display = 'flex'; shield.style.background = dark ? '#000b' : 'transparent'; shield.textContent = dark ? 'Ad playing…' : ''; };
  const shieldOff = () => { shield.style.display = 'none'; };
  function toast(text){
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000d;color:#fff;border-radius:99px;padding:10px 18px;z-index:100000;font:700 15px system-ui,sans-serif';
    t.textContent = text; document.body.append(t); setTimeout(() => t.remove(), 2200);
  }

  // ---- Gameplay start/stop follows the game's #overlay: menus, game over and pause cards are "not playing" ----
  let playing = false, adActive = false, sdk;
  const overlayEl = document.getElementById('overlay');
  function sync(){
    const should = !adActive && !!overlayEl && overlayEl.hidden;
    if (should && !playing) { playing = true; sdk.start(); }
    else if (!should && playing) { playing = false; sdk.stop(); }
  }
  if (overlayEl) new MutationObserver(sync).observe(overlayEl, { attributes: true, attributeFilter: ['hidden'] });

  // ---- One ad flow for both portals: `request(kind, hooks)` is portal specific ----
  function runAd(kind, onReward, onDone){
    adActive = true; sync(); shieldOn(false);
    let finished = false;
    const end = rewarded => {
      if (finished) return; finished = true;
      audio(true); shieldOff(); adActive = false;
      if (kind === 'rewarded') rewarded ? onReward() : toast('Reward not earned: the ad was unavailable or skipped');
      else onDone();
      sync();
    };
    const start = () => { audio(false); shieldOn(true); };
    try { sdk.request(kind, start, end); } catch { end(false); }
  }
  Ads.interstitial = done => runAd('midgame', null, done);
  Ads.rewarded = done => runAd('rewarded', done, null);

  // ---- Portal SDKs ----
  if (target === 'poki') {
    const P = () => window.PokiSDK;
    sdk = {
      start: () => P()?.gameplayStart?.(),
      stop: () => P()?.gameplayStop?.(),
      request(kind, onStart, end){
        if (!P()) return end(kind !== 'rewarded');              // SDK blocked: interstitials just continue, rewards are not given
        if (kind === 'midgame') Promise.resolve(P().commercialBreak(onStart)).then(() => end(true), () => end(true));
        else {                                                  // accept both the callback and the options form of rewardedBreak
          const opts = Object.assign(() => onStart(), { onStart, size: 'small' });
          Promise.resolve(P().rewardedBreak(opts)).then(ok => end(!!ok), () => end(false));
        }
      },
    };
    if (location.hostname === 'localhost') P()?.setDebug?.(true);
    Promise.resolve(P()?.init?.()).then(() => P()?.gameLoadingFinished?.(), () => P()?.gameLoadingFinished?.());
  } else if (target === 'crazygames') {
    const C = () => window.CrazyGames?.SDK;
    // The SDK's modules may only be used once init() has resolved; a hung init gives up after 4s so ads never block the game
    const ready = Promise.race([Promise.resolve(C()?.init?.()).then(() => true, () => false), new Promise(r => setTimeout(r, 4000, false))]);
    ready.then(ok => { if (ok) { C().game?.loadingStart?.(); C().game?.loadingStop?.(); } });
    sdk = {
      start: () => ready.then(ok => ok && C().game?.gameplayStart?.()),
      stop: () => ready.then(ok => ok && C().game?.gameplayStop?.()),
      request(kind, onStart, end){
        ready.then(ok => {
          if (!ok || !C()?.ad) return end(kind !== 'rewarded');
          C().ad.requestAd(kind, { adStarted: onStart, adFinished: () => end(true), adError: () => end(kind !== 'rewarded') });
        });
      },
    };
  } else return;

  // Keyboard is disabled while an ad runs (Poki asks for this); the capture phase runs before the game's own handlers
  for (const type of ['keydown', 'keyup']) addEventListener(type, e => { if (adActive) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  // The page sits in an iframe: stop arrow keys and space from scrolling the host page. The wheel is only blocked for
  // canvas games, because the two puzzle games with long pages need to scroll on small screens.
  addEventListener('keydown', e => { if ([' ', 'ArrowUp', 'ArrowDown'].includes(e.key) && e.target === document.body) e.preventDefault(); });
  if (document.querySelector('canvas')) addEventListener('wheel', e => e.preventDefault(), { passive: false });
  sync();
})();

</script>
</body>
